name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Core + CLI + tests (Linux, GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DACESTUDIO_BUILD_APP=OFF -DACESTUDIO_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Full build (Windows, MSVC, Qt)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      # aqtinstall (used by install-qt-action) is not yet tested on the
      # runner's default Python; pin a known-good one.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt 6.12 (target LTS)
        id: qt612
        continue-on-error: true
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.*'
          arch: win64_msvc2022_64
          cache: true
          setup-python: false
      - name: Install Qt 6.8 LTS (fallback if 6.12 is not yet installable)
        if: steps.qt612.outcome == 'failure'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true
          setup-python: false
      - name: Report Qt version
        shell: pwsh
        run: |
          qmake -query QT_VERSION
          if ("${{ steps.qt612.outcome }}" -eq "failure") { echo "::warning::Qt 6.12 install failed; built against Qt 6.8 LTS instead" }
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DACESTUDIO_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Stage application (windeployqt, dynamic Qt)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/app/AceStudio.exe dist/
          Copy-Item build/cli/acestudio-cli.exe dist/
          windeployqt --release --no-translations --no-system-d3d-compiler dist/AceStudio.exe
      - uses: actions/upload-artifact@v4
        with:
          name: AceStudio-windows-x64
          path: dist/
