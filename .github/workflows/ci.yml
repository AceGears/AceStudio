name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Core + CLI + tests (Linux, GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DACESTUDIO_BUILD_APP=OFF -DACESTUDIO_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: AI worker tests (protocol, cancellation, crash, downloads)
        working-directory: ai_worker
        run: python3 -m unittest discover -s tests -v

  windows:
    name: Full build (Windows, MSVC, Qt)
    runs-on: windows-2022
    permissions:
      contents: write   # publishes the "nightly" pre-release below
    steps:
      - uses: actions/checkout@v4
      # aqtinstall (used by install-qt-action) is not yet tested on the
      # runner's default Python; pin a known-good one.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # aqtinstall 3.3.0 (the newest PyPI release) cannot read the Qt 6.11+
      # Windows repository layout ("Failed to download checksum for the file
      # 'Updates.xml'"). The fix, miurahr/aqtinstall#1000, was merged on
      # 2026-03-24 but is unreleased, so install aqtinstall from that merge
      # commit (pinned by SHA). Fall back to 6.11, then to 6.8 LTS from PyPI.
      - name: Install Qt 6.12 (target LTS)
        id: qt612
        continue-on-error: true
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.*'
          arch: win64_msvc2022_64
          cache: true
          setup-python: false
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'
      - name: Install Qt 6.11 (fallback)
        id: qt611
        if: steps.qt612.outcome == 'failure'
        continue-on-error: true
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.*'
          arch: win64_msvc2022_64
          cache: true
          setup-python: false
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'
      - name: Diagnose Qt availability
        if: steps.qt612.outcome == 'failure' && steps.qt611.outcome == 'failure'
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pip install -q "git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b"
          $v = python -m aqt list-qt windows desktop 2>&1 | Out-String
          Write-Host "::warning::Available Qt versions (tail): $(($v -split "`n" | Select-Object -Last 3) -join ' | ')"
          $a = python -m aqt list-qt windows desktop --arch 6.12.0 2>&1 | Out-String
          Write-Host "::warning::Qt 6.12.0 arches: $($a.Trim())"
          Write-Host "::warning::aqtinstall version: $(python -m aqt version 2>&1 | Out-String)"
      - name: Install Qt 6.8 LTS (last-resort fallback)
        if: steps.qt612.outcome == 'failure' && steps.qt611.outcome == 'failure'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true
          setup-python: false
          aqtversion: '>=3.1.0'
      - name: Report Qt version
        shell: pwsh
        run: |
          qmake -query QT_VERSION
          echo "::notice::Built against Qt $(qmake -query QT_VERSION)"
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        # The release licence public key comes from the repository variable
        # ACESTUDIO_LICENCE_PUBLIC_KEY (tools/licence/README.md); without it the
        # build uses the development key and says so in Help › Licence.
        env:
          LICENCE_PUBLIC_KEY: ${{ vars.ACESTUDIO_LICENCE_PUBLIC_KEY }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DACESTUDIO_WARNINGS_AS_ERRORS=ON "-DACESTUDIO_LICENCE_PUBLIC_KEY=${{ env.LICENCE_PUBLIC_KEY }}"
      - name: Build
        shell: pwsh
        run: |
          # -k 0: keep going so every compile error is reported in one run
          cmake --build build -- -k 0 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          # Surface compiler diagnostics as annotations so they are visible
          # without downloading the full log.
          Select-String -Path build.log -Pattern '(error|warning) (C|LNK)\d+|fatal error' |
            Select-Object -First 40 | ForEach-Object {
              $msg = $_.Line.Trim() -replace '%','%25'
              if ($_.Line -match 'error') { Write-Host "::error::$msg" } else { Write-Host "::warning::$msg" }
            }
          exit $code
      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build --output-on-failure 2>&1 | Tee-Object -FilePath test.log
          $code = $LASTEXITCODE
          # GitHub keeps 10 error annotations per step: diagnostics go out as
          # warnings, and each failure's context as one multi-line warning.
          Select-String -Path test.log -Pattern 'AIDIAG' | Select-Object -First 5 |
            ForEach-Object { Write-Host "::warning::$($_.Line.Trim())" }
          Select-String -Path test.log -Pattern 'FAILED:' -Context 0,10 | Select-Object -First 4 |
            ForEach-Object { $ctx = (@($_.Line) + $_.Context.PostContext) -join '%0A'; Write-Host "::warning::$ctx" }
          Select-String -Path test.log -Pattern '\*\*\*Failed|tests failed out of' | Where-Object { $_.Line -notmatch ' 0 tests failed' } | Select-Object -First 9 |
            ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-windows
          path: |
            build.log
            test.log
          if-no-files-found: ignore
      - name: Stage application (windeployqt, dynamic Qt)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/app/AceStudio.exe dist/
          Copy-Item build/cli/acestudio-cli.exe dist/
          Copy-Item build/mcp/acestudio-mcp.exe dist/
          windeployqt --release --no-translations --no-system-d3d-compiler --no-compiler-runtime dist/AceStudio.exe
          windeployqt --release --no-translations --no-system-d3d-compiler --no-compiler-runtime dist/acestudio-mcp.exe
          # App-local Visual C++ runtime (allowed by the Visual Studio redistribution
          # terms), so the app starts on PCs without the VC++ 2015-2022 redistributable.
          $crt = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter "Microsoft.VC14*.CRT" | Select-Object -First 1
          if (-not $crt) { Write-Error "VC++ CRT redist folder not found under $env:VCToolsRedistDir"; exit 1 }
          Write-Host "CRT from $($crt.FullName)"
          Copy-Item "$($crt.FullName)\*.dll" dist/
          # Every VC runtime DLL any shipped binary imports must be in the package.
          $missing = @()
          foreach ($bin in Get-ChildItem dist -Recurse -Include *.exe, *.dll) {
            $deps = dumpbin /dependents $bin.FullName | Select-String -Pattern '^\s+((msvcp|vcruntime|concrt|vccorlib)\S*\.dll)' |
              ForEach-Object { $_.Matches[0].Groups[1].Value }
            foreach ($d in $deps) { if (-not (Test-Path "dist/$d")) { $missing += "$($bin.Name) -> $d" } }
          }
          if ($missing) { Write-Error ("Missing VC runtime DLLs:`n" + ($missing -join "`n")); exit 1 }
          Get-ChildItem dist -Filter *.dll | Where-Object { $_.Name -match '^(msvcp|vcruntime|concrt)' } | ForEach-Object { Write-Host "app-local: $($_.Name)" }
          # The AI worker ships next to the executables (without its tests).
          New-Item -ItemType Directory -Force dist/ai_worker | Out-Null
          Copy-Item -Recurse ai_worker/acestudio_worker, ai_worker/requirements, ai_worker/catalog dist/ai_worker/
          Get-ChildItem dist/ai_worker -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
      - name: AI worker tests (Windows Python)
        shell: pwsh
        working-directory: ai_worker
        run: python -m unittest discover -s tests -v
      - name: Packaged CLI finds the AI worker
        shell: pwsh
        run: |
          $env:ACESTUDIO_DATA_DIR = "$env:RUNNER_TEMP/acestudio-data"
          dist/acestudio-cli.exe ai models
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dist/acestudio-cli.exe ai status
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: MCP conformance and SDK clients (packaged acestudio-mcp)
        shell: pwsh
        working-directory: tests/mcp
        run: |
          $root = "$env:RUNNER_TEMP/mcproot"
          New-Item -ItemType Directory -Force $root | Out-Null
          $mcp = (Resolve-Path ../../dist/acestudio-mcp.exe).Path
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $server = Start-Process -FilePath $mcp -ArgumentList "--root", $root, "--http", "39200", "--conformance-fixtures" -PassThru -NoNewWindow
          Start-Sleep -Seconds 2
          $failed = $false
          # Every scenario, then each spec version on its own: no expected failures.
          npx conformance server --url http://127.0.0.1:39200/mcp --suite all
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::MCP conformance (all scenarios) failed"; $failed = $true }
          foreach ($v in "2026-07-28", "2025-11-25", "2025-06-18") {
            npx conformance server --url http://127.0.0.1:39200/mcp --suite all --spec-version $v
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::MCP conformance $v failed"; $failed = $true }
          }
          python py_client.py $mcp $root http://127.0.0.1:39200/mcp
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::MCP Python SDK client checks failed"; $failed = $true }
          node ts_client.mjs $mcp $root http://127.0.0.1:39200/mcp
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::MCP TypeScript SDK client checks failed"; $failed = $true }
          Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          # The live bridge over a real Windows named pipe: the packaged app,
          # offscreen (the plugin is copied in for this test only).
          $dist = (Resolve-Path ../../dist).Path
          Copy-Item "$env:QT_ROOT_DIR/plugins/platforms/qoffscreen.dll" "$dist/platforms/"
          & "$dist/acestudio-cli.exe" new "$root/bridge.acestudio" --width 16 --height 16 --frames 2 --force
          $env:ACESTUDIO_DATA_DIR = "$env:RUNNER_TEMP/acestudio-bridge-data"
          $env:QT_QPA_PLATFORM = "offscreen"
          $app = Start-Process -FilePath "$dist/AceStudio.exe" -ArgumentList "$root/bridge.acestudio" -PassThru -NoNewWindow
          python bridge_client.py $mcp $root
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::MCP app bridge checks failed"; $failed = $true }
          Stop-Process -Id $app.Id -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QPA_PLATFORM
          Start-Sleep -Seconds 1
          Remove-Item "$dist/platforms/qoffscreen.dll" -ErrorAction SilentlyContinue
          if ($failed) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: AceStudio-windows-x64
          path: dist/
      # Same build as a release file: release downloads work with a token from
      # tools that cannot reach the artifact storage host. The repository is
      # private, so the pre-release is visible to collaborators only.
      - name: Publish nightly pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist/* -DestinationPath AceStudio-windows-x64.zip -Force
          Get-Item AceStudio-windows-x64.zip | ForEach-Object { Write-Host "zip size: $($_.Length) bytes" }
          # The repository uses immutable releases: a tag can never be reused
          # and assets cannot be added after publishing. So every build gets
          # its own tag, created together with its zip.
          $short = $env:GITHUB_SHA.Substring(0,7)
          $tag = "nightly-$short"
          $out = gh release create $tag AceStudio-windows-x64.zip --prerelease --target $env:GITHUB_SHA `
            --title "Nightly $short" `
            --notes "Automatic Windows build of $env:GITHUB_SHA for testing. Unsigned; not a release." 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::gh release create: $($out -join ' ')"; exit 1 }
          # Keep the five newest nightlies; deleting older ones is best effort.
          $old = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.tag_name | startswith("nightly-"))] | sort_by(.created_at) | reverse | .[5:] | .[].tag_name'
          foreach ($t in $old) { if ($t) { gh release delete $t --yes 2>$null | Out-Null } }
          exit 0
